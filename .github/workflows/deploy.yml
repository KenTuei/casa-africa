name: Deploy App

on:
  push:
    branches:
      - main
      - chomba

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # Example deployment step
      - name: Deploy to server
        run: echo "Deploying branch ${{ github.ref }}..."
